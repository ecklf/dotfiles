onboarding = false

[terminal]
# Default: use $SHELL, then /bin/sh. Always start zsh instead.
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+b"

# Defaults: settings=s, picker=w, goto=g, new=Shift-n, close=Shift-d,
# reload=Shift-r. These follow the tmux session bindings instead.
settings = "prefix+comma"
workspace_picker = "prefix+s"
goto = "prefix+w"
detach = "prefix+d"
new_workspace = "prefix+shift+s"
close_workspace = "prefix+shift+x"
reload_config = "prefix+r"

# Tabs correspond to tmux windows.
# New tab remains the default prefix+c binding.
new_tab = "prefix+c"
# Default close is prefix+Shift-x; move it to avoid the workspace-close binding.
close_tab = "prefix+shift+c"
# Defaults use prefix+p/n. Match tmux's direct Alt brackets and F5/F6 instead.
previous_tab = ["alt+[", "f5"]
next_tab = ["alt+]", "f6"]

# Pane creation and navigation.
# Defaults split with prefix+minus and prefix+v; tmux uses quote and pipe.
split_horizontal = "prefix+\""
split_vertical = "prefix+|"
# Match tmux's prefix navigation and vim-tmux-navigator's direct Ctrl+hjkl.
focus_pane_left = ["prefix+h", "ctrl+h"]
focus_pane_down = ["prefix+j", "ctrl+j"]
focus_pane_up = ["prefix+k", "ctrl+k"]
focus_pane_right = ["prefix+l", "ctrl+l"]
zoom = "prefix+z"

# Match tmux's prefix+HJKL and direct Ctrl+Shift+HJKL resizing.
# Directional resize bindings are unset by default. Resize mode normally uses
# prefix+r, and pane swapping normally occupies prefix+Shift+HJKL.
resize_mode = "prefix+shift+r"
resize_pane_left = ["prefix+shift+h", "ctrl+shift+h"]
resize_pane_down = ["prefix+shift+j", "ctrl+shift+j"]
resize_pane_up = ["prefix+shift+k", "ctrl+shift+k"]
resize_pane_right = ["prefix+shift+l", "ctrl+shift+l"]
swap_pane_left = "prefix+alt+h"
swap_pane_down = "prefix+alt+j"
swap_pane_up = "prefix+alt+k"
swap_pane_right = "prefix+alt+l"

# Custom commands have no default bindings. These mirror the tmux popups.
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"

# Default: catppuccin. Use Kanagawa as the closest built-in Kanso base.
[theme]
name = "kanagawa"

# Override the built-in palette with the Kanso Ink colors used by tmux.
[theme.custom]
panel_bg = "#14171d"
sidebar_bg = "#14171d"
active_row_bg = "#24262d"
selection_bg = "#24262d"
surface0 = "#24262d"
surface1 = "#5c5c5c"
surface_dim = "#090e13"
overlay0 = "#a4a7a4"
overlay1 = "#c5c9c7"
text = "#c5c9c7"
subtext0 = "#a4a7a4"
accent = "#8ba4b0"
red = "#c4746e"
green = "#8a9a7b"
yellow = "#c4b28a"
blue = "#8ba4b0"
teal = "#8ea4a2"
mauve = "#a292a3"

[ui]
mouse_capture = true
# Defaults: prompt for tab names, but not workspace names. tmux creates windows
# immediately and prompts when creating a named session.
prompt_new_tab_name = false
prompt_new_workspace_name = true
# Defaults enable outer borders, scrollbars, and pane gaps. Disable them for
# tmux-style shared internal dividers.
pane_outer_borders = false
pane_scrollbars = false
pane_gaps = false
# Default: top tab bar with no right-side status entries.
tab_bar_position = "bottom"
tab_bar_right = [
  { type = "zoom" },
  { type = "hostname" },
  { type = "datetime", format = "%Y-%m-%d %H:%M" },
]
tab_bar_right_separator = " "

[advanced]
# Default: 10 MB. Raise this to approximate tmux's 50,000-line history limit.
scrollback_limit_bytes = 50000000
